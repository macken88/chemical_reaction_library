[project]
name = "chemical-reaction-library"
version = "0.1.0"
description = "Personal reaction validation and library backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "rdkit>=2024.9.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
